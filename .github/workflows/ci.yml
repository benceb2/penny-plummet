name: CI

on:
  pull_request:
    types: [opened, synchronize]
  push:
    branches: [main]

jobs:
  unit-tests:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Type check
        run: npm run type-check

      - name: Unit tests
        run: npm test

  a11y-tests:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Type check
        run: npm run type-check

      - name: Cache Playwright browsers
        uses: actions/cache@v4
        with:
          path: ~/.cache/ms-playwright
          key: ${{ runner.os }}-playwright-${{ hashFiles('package-lock.json') }}
          restore-keys: |
            ${{ runner.os }}-playwright-

      - name: Install Playwright browsers
        run: npx playwright install --with-deps

      - name: A11y tests
        run: npm run test:a11y

  screenshot-tests:
    runs-on: ubuntu-latest
    # Runs in the same image `scripts/screenshots.sh` uses locally. Baselines
    # are only comparable when the font stack and renderer match, so the image
    # tag has to stay in step with the @playwright/test version.
    container:
      image: mcr.microsoft.com/playwright:v1.57.0-noble
      options: --ipc=host
    steps:
      - uses: actions/checkout@v4

      - name: Install dependencies
        run: npm ci

      - name: Screenshot tests
        run: npx playwright test --project=iphone-14 --project=iphone-se --project=pixel-7 --project=desktop

      - name: Upload diffs
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: screenshot-diffs
          path: playwright-report/
          retention-days: 7
